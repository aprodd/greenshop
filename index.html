<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenShop</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="container">
        <main>
            <div class="product-filter">
                <div class="catalog-menu">
                    <a href="#" class="catalog-link">All Plants</a>
                    <a href="#" class="catalog-link">New Arrivals</a>
                    <a href="#" class="catalog-link">Sale</a>
                </div>
                <div class="catalog-option">
                    <p>Short by:</p>
                    <select>
                        <option>Default sorting</option>
                        <option>Featured</option>
                        <option>Best selling</option>
                    </select>
                </div>
            </div>
            <div class="products">
                <article>
                    <a href="#" class="product-item">
                        <div class="product-item-head">
                            <img src="./images/product_card/img1.png" alt="Barberton Daisy">
                            <div class="product-icons">
                                <img src="./images/icon_1.svg" alt="">
                                <img src="./images/icon_2.svg" alt="">
                                <img src="./images/icon_3.svg" alt="">
                            </div>
                        </div>
                        <div class="product-item-body">
                            <h3 class="product-name">Barberton Daisy</h3>
                            <p class="product-price">$119.00</p>
                        </div>
                    </a>
                </article>
                <article>
                    <a href="#" class="product-item">
                        <div class="product-item-head">
                            <img src="./images/product_card/img2.png" alt="Angel Wing Begonia">
                            <div class="product-icons">
                                <img src="./images/icon_1.svg" alt="">
                                <img src="./images/icon_2.svg" alt="">
                                <img src="./images/icon_3.svg" alt="">
                            </div>
                        </div>
                        <div class="product-item-body">
                            <h3 class="product-name">Angel Wing Begonia</h3>
                            <p class="product-price">$169.00</p>
                        </div>
                    </a>
                </article>
                <article>
                    <a href="#" class="product-item">
                        <div class="product-item-head">
                            <img src="./images/product_card/img3.png" alt="African Violet">
                            <div class="product-sale">13% off</div>
                            <div class="product-icons">
                                <img src="./images/icon_1.svg" alt="">
                                <img src="./images/icon_2.svg" alt="">
                                <img src="./images/icon_3.svg" alt="">
                            </div>
                        </div>
                        <div class="product-item-body">
                            <h3 class="product-name">African Violet</h3>
                            <div class="product-value">
                                <p class="product-price">$199.00</p>
                                <p class="product-price-old">$229.00</p>
                            </div>
                        </div>
                    </a>
                </article>
            </div>
        </main>
    </div>
</body>
</html>
